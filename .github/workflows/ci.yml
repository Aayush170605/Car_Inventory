name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Backend tests and coverage
        working-directory: backend
        run: python -m pytest --cov=app --cov-branch --cov-fail-under=95 --cov-report=term-missing --junitxml=../docs/backend-junit.xml
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests and production build
        working-directory: frontend
        run: |
          npm test
          npm run build
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: frontend
        env:
          PYTHON: python
        run: npm run test:e2e
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            docs/*junit.xml
            docs/*.png
            frontend/test-results/
